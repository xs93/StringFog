import com.github.megatronking.stringfog.plugin.StringFogMode

plugins {
    id 'com.android.application'
    id 'stringfog'
}

android {
    namespace = 'com.example.app'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.example.app'
        minSdk = 23
        targetSdk = 36
        versionCode = 1
        versionName = '1.0'
    }
}

stringfog {
    implementation = 'com.github.megatronking.stringfog.xor.StringFogImpl'
    fogPackages = ['com.example.app']
    mode = StringFogMode.base64
}

dependencies {
    implementation project(':library-base64')
    implementation project(':library-bytes')
    implementation files(rootProject.ext.stringFogRuntimeClasspath)
}
